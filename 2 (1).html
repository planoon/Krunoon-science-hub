        function prepareRandomizedQuiz() {
            quizData = originalQuizData.map(q => {
                let optionsWithFlag = q.options.map(opt => ({
                    text: opt,
                    isCorrect: (opt === q.correctText)
                }));
                optionsWithFlag.sort(() => Math.random() - 0.5);
                let newCorrectIndex = optionsWithFlag.findIndex(o => o.isCorrect);
                return {
                    question: q.question,
                    options: optionsWithFlag.map(o => o.text),
                    answer: newCorrectIndex,
                    explanation: q.explanation,
                    formulaHint: q.formulaHint
                };
            });
            quizData.sort(() => Math.random() - 0.5);
        }

        let activeLightningQuiz = [];

        function prepareLightningQuizGame() {
            activeLightningQuiz = lightningQuizBank.map(q => {
                let opts = [...q.options];
                opts.sort(() => Math.random() - 0.5);
                return {
                    question: q.question,
                    options: opts,
                    correct: q.correctText,
                    explanation: q.explanation
                };
            });
            activeLightningQuiz.sort(() => Math.random() - 0.5);
            gameState.lightningQIndex = 0;
            gameState.lightningScore = 0;
            gameState.lightningGamePhase = 'playing';
            gameState.carX = 250;
        }

        // --- XP Calculation Function ---
        function calculateTotalXP() {
            let flashcardXP = gameState.viewedFlashcards.size * 10;
            let simXP = gameState.simsTested.size * 50;
            let quizXP = gameState.quizScore * 100;
            let lightningGameXP = gameState.lightningScore * 50;
            let penaltyXP = gameState.hintUsedCount * 10;
            gameState.xp = Math.max(0, flashcardXP + simXP + quizXP + lightningGameXP - penaltyXP);
            return gameState.xp;
        }

        // --- Initialization on Load ---
        window.onload = function() {
            prepareRandomizedQuiz();
            renderScreen();
        };

        // --- Screen Router ---
        function renderScreen() {
            const mainView = document.getElementById('main-view');
            const playerStatus = document.getElementById('player-status');

            calculateTotalXP();

            if (gameState.currentScreen === 'welcome') {
                playerStatus.classList.add('hidden');
                mainView.innerHTML = renderWelcomeScreen();
            } else {
                playerStatus.classList.remove('hidden');
                document.getElementById('display-player-name').innerText = gameState.playerName || "ผู้เล่น";
                document.getElementById('display-xp').innerText = gameState.xp;

                if (gameState.currentScreen === 'menu') {
                    mainView.innerHTML = renderMenuScreen();
                } else if (gameState.currentScreen === 'mode1') {
                    mainView.innerHTML = renderMode1Screen();
                } else if (gameState.currentScreen === 'mode2') {
                    mainView.innerHTML = renderMode2Screen();
                    initSimulationCanvas();
                } else if (gameState.currentScreen === 'mode3') {
                    mainView.innerHTML = renderMode3Screen();
                } else if (gameState.currentScreen === 'mode4') {
                    mainView.innerHTML = renderMode4Screen();
                    if (gameState.lightningGamePhase === 'racing') {
                        initRaceCanvas();
                    }
                } else if (gameState.currentScreen === 'summary') {
                    mainView.innerHTML = renderSummaryScreen();
                }
            }

        function updateVectorMag() {
            const f1Input = document.getElementById('num-f1');
            const f2Input = document.getElementById('num-f2');
            if (f1Input && f2Input) {
                let val1 = parseInt(f1Input.value) || 10;
                let val2 = parseInt(f2Input.value) || 10;
                gameState.vec1Mag = Math.max(10, Math.min(80, val1));
                gameState.vec2Mag = Math.max(10, Math.min(80, val2));
                initSimulationCanvas();
            }
        }

        let simAnimFrame = null;
        let simProgress = 0;

        function initSimulationCanvas() {
            const canvas = document.getElementById('sim-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            simProgress = 0;

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (gameState.simSubTab === 'vector') {
                    document.getElementById('sim-title-label').innerText = "การจำลองการรวมเวกเตอร์แรง (ป้ายชื่อตรงเส้นแรง)";
                    drawVectorSimulation(ctx, canvas, 1);
                } else if (gameState.simSubTab === 'netforce') {
                    document.getElementById('sim-title-label').innerText = "สถานการณ์จำลองแรงลัพธ์ (รองรับบวก, ลบ และศูนย์)";
                    drawNetForceSimulation(ctx, canvas, 1);
                } else if (gameState.simSubTab === 'friction') {
                    document.getElementById('sim-title-label').innerText = "สถานการณ์จำลองแรงเสียดทานและพื้นผิว 4 แบบ";
                    drawFrictionSimulation(ctx, canvas, 1);
                } else if (gameState.simSubTab === 'newton') {
                    document.getElementById('sim-title-label').innerText = "การจำลองกฎการเคลื่อนที่นิวตัน (รูปแอปเปิ้ล)";
                    drawNewtonSimulation(ctx, canvas, 1);
                } else {
                    document.getElementById('sim-title-label').innerText = "การจำลองแรงพยุงเปรียบเทียบน้ำหนักวัตถุ";
                    drawFluidSimulation(ctx, canvas, 1);
                }
            }
            draw();
        }

        function runSimAnimation() {
            simProgress = 0;
            const canvas = document.getElementById('sim-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function animateLoop() {
                simProgress += 0.03;
                if (simProgress > 1) simProgress = 1;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (gameState.simSubTab === 'vector') {
                    drawVectorSimulation(ctx, canvas, simProgress);
                } else if (gameState.simSubTab === 'netforce') {
                    drawNetForceSimulation(ctx, canvas, simProgress);
                } else if (gameState.simSubTab === 'friction') {
                    drawFrictionSimulation(ctx, canvas, simProgress);
                } else if (gameState.simSubTab === 'newton') {
                    drawNewtonSimulation(ctx, canvas, simProgress);
                } else {
                    drawFluidSimulation(ctx, canvas, simProgress);
                }

                if (simProgress < 1) {
                    simAnimFrame = requestAnimationFrame(animateLoop);
                }
            }
            if (simAnimFrame) cancelAnimationFrame(simAnimFrame);
            animateLoop();
        }

        function resetSimulationState() {
            simProgress = 0;
            initSimulationCanvas();
        }

        function drawArrowVector(ctx, fx, fy, tx, ty, color, label, labelPosition = 'middle') {
            const headLen = 8;
            const angle = Math.atan2(ty - fy, tx - fx);
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 3;

            ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(tx, ty); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(tx - headLen * Math.cos(angle - Math.PI/6), ty - headLen * Math.sin(angle - Math.PI/6));
            ctx.lineTo(tx - headLen * Math.cos(angle + Math.PI/6), ty - headLen * Math.sin(angle + Math.PI/6));
            ctx.fill();

            if (label) {
                ctx.font = '11px Prompt';
                ctx.fillStyle = '#f8fafc';
                let lx = (fx + tx)/2;
                let ly = (fy + ty)/2;
                if (labelPosition === 'f1') {
                    lx = fx + (tx - fx) * 0.4;
                    ly = fy + (ty - fy) * 0.4 - 10;
                } else if (labelPosition === 'resultant') {
                    lx = fx + (tx - fx) * 0.6;
                    ly = fy + (ty - fy) * 0.6 + 15;
                } else {
                    ly -= 10;
                }
                ctx.fillText(label, lx, ly);
            }
        }

        function drawRuler(ctx, canvas) {
            const startX = 40;
            const rulerY = canvas.height - 25;
            const totalUnits = 12;
            const unitWidth = 35;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 1;

            ctx.beginPath();
            ctx.moveTo(startX, rulerY);
            ctx.lineTo(startX + totalUnits * unitWidth, rulerY);
            ctx.stroke();

            ctx.font = '10px Prompt';
            ctx.fillText("ไม้บรรทัดสเกลแรง (1 ช่อง = 10 N):", startX, rulerY - 12);

            for (let i = 0; i <= totalUnits; i++) {
                let rx = startX + i * unitWidth;
                let tickH = (i % 5 === 0) ? 8 : 4;
                ctx.beginPath();
                ctx.moveTo(rx, rulerY);
                ctx.lineTo(rx, rulerY + tickH);
                ctx.stroke();

                if (i % 2 === 0) {
                    ctx.fillText(i * 10, rx - 6, rulerY + 18);
                }
            }
        }

        function drawVectorSimulation(ctx, canvas, prog = 1) {
            const startX = 50;
            const startY = 160;
            const f1 = gameState.vec1Mag;
            const f2 = gameState.vec2Mag;

            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawRuler(ctx, canvas);

            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            for (let i = 0; i < canvas.width; i += 30) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height - 40); ctx.stroke();
            }

            const scale = 3.5;

            if (gameState.vectorMode === 'headtail') {
                const end1X = startX + f1 * scale * prog;
                const end1Y = startY;
                drawArrowVector(ctx, startX, startY, end1X, end1Y, '#38bdf8', `F₁ = ${f1} N`, 'f1');

                if (prog >= 0.5) {
                    const prog2 = (prog - 0.5) * 2;
                    const end2X = end1X + f2 * scale * 0.7 * prog2;
                    const end2Y = end1Y - f2 * scale * 0.7 * prog2;
                    drawArrowVector(ctx, end1X, end1Y, end2X, end2Y, '#818cf8', `F₂ = ${f2} N`, 'middle');

                    if (prog >= 0.9) {
                        const resultant = Math.round(Math.sqrt(f1*f1 + f2*f2));
                        drawArrowVector(ctx, startX, startY, end2X, end2Y, '#34d399', `แรงลัพธ์ (R) = ${resultant} N`, 'resultant');
                        document.getElementById('sim-external-desc').innerHTML = `
                            ✅ <b>แบบหัวต่อหาง:</b> ป้ายชื่อ F₁ และ แรงลัพธ์ วางทาบตรงเส้นแรงพอดี | แรงลัพธ์ R = √(F₁² + F₂²) ≈ <b>${resultant} N</b>
                        `;
                    }
                } else {
                    document.getElementById('sim-external-desc').innerHTML = `📌 กำลังแสดงแรงที่ 1 (F₁ = ${f1} N) ตรงเส้นแรง`;
                }
            } else {
                const end1X = startX + f1 * scale * prog;
                const end1Y = startY;
                const end2X = startX + f2 * scale * 0.6 * prog;
                const end2Y = startY - f2 * scale * 0.6 * prog;

                drawArrowVector(ctx, startX, startY, end1X, end1Y, '#38bdf8', `F₁ = ${f1} N`, 'f1');
                drawArrowVector(ctx, startX, startY, end2X, end2Y, '#818cf8', `F₂ = ${f2} N`, 'middle');

                if (prog >= 0.7) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([5, 5]);

                    ctx.beginPath();
                    ctx.moveTo(end1X, end1Y);
                    ctx.lineTo(end1X + (end2X - startX), end1Y + (end2Y - startY));
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(end2X, end2Y);
                    ctx.lineTo(end1X + (end2X - startX), end1Y + (end2Y - startY));
                    ctx.stroke();
                    ctx.setLineDash([]);

                    const resultant = Math.round(Math.sqrt(f1*f1 + f2*f2));
                    drawArrowVector(ctx, startX, startY, end1X + (end2X - startX), end1Y + (end2Y - startY), '#34d399', `แรงลัพธ์ (เส้นทแยงมุม) = ${resultant} N`, 'resultant');
                    document.getElementById('sim-external-desc').innerHTML = `
                        ✅ <b>แบบสี่เหลี่ยมด้านขนาน:</b> แรงลัพธ์อยู่บนเส้นทแยงมุม R ≈ <b>${resultant} N</b>
                    `;
                } else {
                    document.getElementById('sim-external-desc').innerHTML = `📌 กำลังแสดงหางต่อหางของ F₁ และ F₂`;
                }
            }
        }

        function drawNetForceSimulation(ctx, canvas, prog = 0) {
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 220, canvas.width, 60);

            const fRight = gameState.netRight;
            const fLeft = gameState.netLeft;
            const net = fRight - fLeft;

            let boxX = 220;
            if (net !== 0) {
                boxX += Math.sign(net) * prog * 50;
            }

            ctx.fillStyle = '#6366f1';
            ctx.roundRect(boxX, 150, 70, 70, 10);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = '12px Prompt';
            ctx.fillText("กล่อง ม.2", boxX + 12, 190);

            if (fRight > 0) {
                drawArrowVector(ctx, boxX + 70, 185, boxX + 70 + fRight * 1.0, 185, '#38bdf8', `F_right = ${fRight} N`);
            }
            if (fLeft > 0) {
                drawArrowVector(ctx, boxX, 185, boxX - fLeft * 1.0, 185, '#f43f5e', `F_left = ${fLeft} N`);
            }

            let caseTitle = "";
            let motionText = "";
            if (net > 0) {
                caseTitle = "กรณีที่ 1: แรงลัพธ์เป็นบวก (+)";
                motionText = `แรงลัพธ์ (F_net) = +${net} N มีทิศทางไปทางขวา กล่องเคลื่อนที่ไปข้างหน้า`;
            } else if (net < 0) {
                caseTitle = "กรณีที่ 2: แรงลัพธ์เป็นลบ (-)";
                motionText = `แรงลัพธ์ (F_net) = ${net} N มีทิศทางไปทางซ้าย กล่องเคลื่อนที่ถอยหลัง`;
            } else {
                caseTitle = "กรณีที่ 3: แรงลัพธ์เป็นศูนย์ (0)";
                motionText = `แรงลัพธ์ (F_net) = 0 N วัตถุสมดุล อยู่นิ่งหรือเคลื่อนที่ด้วยความเร็วคงที่`;
            }

            document.getElementById('sim-external-desc').innerHTML = `<b>${caseTitle}</b><br>${motionText}`;
        }

        function drawFrictionSimulation(ctx, canvas, prog = 0) {
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let mu = 0.3;
            let surfaceName = "พื้นไม้ขัดเรียบ";
            let surfaceColor = "#78350f";

            if (gameState.surfaceType === 'ice') { 
                mu = 0.05; surfaceName = "1. น้ำแข็ง / กระจก (ลื่นมาก)"; surfaceColor = "#1e3a8a"; 
            } else if (gameState.surfaceType === 'wood') { 
                mu = 0.30; surfaceName = "2. พื้นไม้ขัดเรียบ (ปานกลาง)"; surfaceColor = "#78350f"; 
            } else if (gameState.surfaceType === 'concrete') { 
                mu = 0.60; surfaceName = "3. พื้นคอนกรีตขรุขระ (ฝืด)"; surfaceColor = "#475569"; 
            } else if (gameState.surfaceType === 'rough') { 
                mu = 0.85; surfaceName = "4. พื้นทราย / ยางมะตอย (ฝืดมาก)"; surfaceColor = "#1e293b"; 
            }

            ctx.fillStyle = surfaceColor;
            ctx.fillRect(0, 210, canvas.width, 70);

            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            if (gameState.surfaceType === 'ice') {
                for (let i = 20; i < canvas.width; i += 50) {
                    ctx.fillRect(i, 225, 25, 4);
                }
            } else if (gameState.surfaceType === 'concrete') {
                for (let i = 10; i < canvas.width; i += 25) {
                    ctx.fillRect(i, 220 + (i%3)*10, 6, 6);
                }
            } else if (gameState.surfaceType === 'rough') {
                for (let i = 5; i < canvas.width; i += 15) {
                    ctx.fillRect(i, 215 + (i%5)*8, 10, 10);
                }
            }

            const normalF = gameState.normalForce;
            const frictionF = Math.round(mu * normalF);
            const applied = gameState.appliedForce;
            const netF = applied - frictionF;

            let boxX = 200;
            if (netF > 0) {
                let slipFactor = 1.0 - mu;
                boxX += prog * 80 * Math.max(0.2, slipFactor);
            }

            ctx.fillStyle = '#f59e0b';
            ctx.roundRect(boxX, 140, 70, 70, 8);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.font = '12px Prompt';
            ctx.fillText("วัตถุ", boxX + 22, 180);

            drawArrowVector(ctx, boxX + 70, 165, boxX + 70 + applied * 0.9, 165, '#38bdf8', `แรงดึง = ${applied} N`);
            drawArrowVector(ctx, boxX, 185, boxX - frictionF * 1.2, 185, '#ef4444', `แรงเสียดทาน (f=${frictionF}N)`);

            document.getElementById('sim-external-desc').innerHTML = `
                📍 <b>พื้นผิว:</b> ${surfaceName} (μ = ${mu}) | แรงกด (N) = ${normalF} N<br>
                ⚖️ <b>แรงเสียดทาน (f = μN):</b> ${mu} × ${normalF} = <b>${frictionF} N</b> | <b>แรงดึง:</b> ${applied} N<br>
                🚀 <b>ผลลัพธ์:</b> ${applied > frictionF ? `<span class="text-emerald-400 font-bold">แรงดึงชนะแรงเสียดทาน วัตถุเคลื่อนที่ได้</span>` : '<span class="text-rose-400 font-bold">แรงดึงยังน้อยกว่าแรงเสียดทาน วัตถุนิ่งอยู่กับที่</span>'}
            `;
        }

        // --- Newton's Laws Simulation with Apple Graphic ---
        function drawNewtonSimulation(ctx, canvas, prog = 0) {
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 220, canvas.width, 60);

            const rule = gameState.newtonRule;
            let descText = "";

            if (rule === 1) {
                descText = "กฎข้อที่ 1 (ความเฉื่อย): แอปเปิ้ลรักษาสภาพเดิมเพราะแรงลัพธ์เป็นศูนย์ (ΣF = 0)";
                const appleX = 80 + prog * 200;
                ctx.fillStyle = '#ef4444';
                ctx.beginPath(); ctx.arc(appleX, 185, 25, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#10b981';
                ctx.fillRect(appleX - 2, 155, 4, 10);
                ctx.fillStyle = 'white';
                ctx.font = '11px Prompt';
                ctx.fillText("แอปเปิ้ล", appleX - 18, 189);
            } else if (rule === 2) {
                descText = "กฎข้อที่ 2 (F = ma): ความเร่ง (a) แปรผันตรงกับแรงลัพธ์ที่มากกระทำต่อแอปเปิ้ล";
                const appleX = 60 + prog * 280;
                ctx.fillStyle = '#ef4444';
                ctx.beginPath(); ctx.arc(appleX, 185, 25, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#10b981';
                ctx.fillRect(appleX - 2, 155, 4, 10);
                drawArrowVector(ctx, appleX + 25, 185, appleX + 80, 185, '#f59e0b', 'F = ma');
                ctx.fillStyle = 'white';
                ctx.font = '11px Prompt';
                ctx.fillText("แอปเปิ้ล", appleX - 18, 189);
            } else {
                descText = "กฎข้อที่ 3 (Action = Reaction): แรงกิริยาและแรงปฏิกิริยาระหว่างแอปเปิ้ลกับพื้น";
                const appleX = 260;
                ctx.fillStyle = '#ef4444';
                ctx.beginPath(); ctx.arc(appleX, 175, 25, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#10b981';
                ctx.fillRect(appleX - 2, 145, 4, 10);
                drawArrowVector(ctx, appleX, 200, appleX, 240, '#38bdf8', 'แรงปฏิกิริยา (N)');
                drawArrowVector(ctx, appleX, 150, appleX, 110, '#f43f5e', 'น้ำหนัก (W)');
                ctx.fillStyle = 'white';
                ctx.font = '11px Prompt';
                ctx.fillText("แอปเปิ้ล", appleX - 18, 179);
            }

            document.getElementById('sim-external-desc').innerText = descText;
        }

        function drawFluidSimulation(ctx, canvas, prog = 0) {
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(16, 185, 129, 0.2)';
            ctx.fillRect(160, 80, 240, 160);
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 2;
            ctx.strokeRect(160, 80, 240, 160);

            const W = gameState.objWeight;
            const Fb = gameState.buoyantForce;

            let objY = 130;
            let statusStr = "";

            if (W > Fb) {
                objY = 190 + Math.sin(prog * Math.PI) * 2;
                statusStr = `🛑 <b>วัตถุจม (Sinking):</b> น้ำหนัก W (${W} N) > แรงพยุง Fb (${Fb} N) วัตถุตกลงสู่ก้นภาชนะสนิท`;
            } else if (W < Fb) {
                objY = 100 - Math.sin(prog * Math.PI) * 3;
                statusStr = `⛵ <b>วัตถุลอย (Floating):</b> น้ำหนัก W (${W} N) < แรงพยุง Fb (${Fb} N) วัตถุลอยโผล่พ้นน้ำบางส่วน`;
            } else {
                objY = 135;
                statusStr = `⚖️ <b>วัตถุลอยปริ่มน้ำ (Neutral):</b> น้ำหนัก W (${W} N) = แรงพยุง Fb (${Fb} N) จมมิดพอดีผิวหน้า`;
            }

            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(240, objY, 80, 50);
            ctx.fillStyle = '#000';
            ctx.font = '12px Prompt';
            ctx.fillText(`W=${W}N`, 255, objY + 30);

            drawArrowVector(ctx, 280, objY + 25, 280, objY + 55, '#f43f5e', `W = ${W} N`);
            drawArrowVector(ctx, 280, objY + 25, 280, objY - 15, '#38bdf8', `Fb = ${Fb} N`);

            document.getElementById('sim-external-desc').innerHTML = statusStr;
        }

        // --- Mode 3: Quiz Screen ---
        function renderMode3Screen() {
            const totalQ = quizData.length;
            if (gameState.quizIndex >= totalQ) {
                gameState.currentScreen = 'summary';
                return renderSummaryScreen();
            }

            const q = quizData[gameState.quizIndex];

            return `
                <div class="w-full max-w-2xl mx-auto flex flex-col">
                    <div class="w-full flex items-center justify-between mb-4">
                        <button onclick="switchScreen('menu')" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-medium flex items-center gap-2 transition-colors">
                            <i class="fa-solid fa-arrow-left"></i> กลับเมนูหลัก
                        </button>
                        <div class="flex items-center gap-3">
                            <span class="px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 text-xs font-bold border border-amber-500/30 flex items-center gap-1.5">
                                <i class="fa-solid fa-bolt text-yellow-400"></i> ${gameState.xp} XP
                            </span>
                            <span class="text-xs font-semibold text-cyan-300">ข้อที่ ${gameState.quizIndex + 1} / ${totalQ}</span>
                        </div>
                    </div>

                    <div class="glass-panel p-6 md:p-8 rounded-3xl shadow-2xl relative">
                        <div class="w-full bg-white/10 h-2 rounded-full mb-6 overflow-hidden">
                            <div class="bg-gradient-to-r from-cyan-400 to-indigo-500 h-full transition-all duration-300" style="width: ${((gameState.quizIndex + 1) / totalQ) * 100}%"></div>
                        </div>

                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-base md:text-lg font-bold text-white leading-relaxed">
                                ${q.question}
                            </h3>
                            <button onclick="toggleQuizHint()" class="px-3 py-1.5 rounded-xl bg-cyan-500/20 hover:bg-cyan-500/40 text-cyan-300 text-xs font-semibold border border-cyan-400/30 flex items-center gap-1.5 transition-colors shrink-0">
                                <i class="fa-solid fa-lightbulb text-yellow-300"></i> ${gameState.showHintBox ? 'ซ่อนสูตร/Hint' : '💡 ขอสูตร/Hint (-10 XP)'}
                            </button>
                        </div>

                        <div id="quiz-hint-box" class="${gameState.showHintBox ? '' : 'hidden'} mb-6 p-4 rounded-2xl bg-indigo-950/80 border border-indigo-400/40 text-xs text-indigo-200 animate-fade-in space-y-2">
                            <p class="font-bold text-cyan-300 flex items-center gap-1">
                                <i class="fa-solid fa-graduation-cap"></i> สูตรและหลักการที่เกี่ยวข้อง (หัก 10 XP):
                            </p>
                            <p class="leading-relaxed bg-black/30 p-3 rounded-xl border border-white/10">${q.formulaHint}</p>
                        </div>

                        <div class="space-y-3 mb-6" id="quiz-options-container">
                            ${q.options.map((opt, idx) => `
                                <button onclick="handleAnswer(${idx})" id="opt-btn-${idx}" 
                                    class="w-full text-left p-4 rounded-2xl glass-card hover:bg-white/20 transition-all text-xs md:text-sm font-medium flex items-center gap-3 group">
                                    <span class="w-7 h-7 rounded-xl bg-white/10 group-hover:bg-cyan-500 group-hover:text-white flex items-center justify-center text-xs font-bold text-cyan-300 transition-colors">
                                        ${String.fromCharCode(65 + idx)}
                                    </span>
                                    <span>${opt}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleQuizHint() {
            if (!gameState.showHintBox) {
                gameState.hintUsedCount++;
                showToast("เปิด Hint สำเร็จ! หัก -10 XP", "error");
            }
            gameState.showHintBox = !gameState.showHintBox;
            renderScreen();
        }

        function handleAnswer(selectedIndex) {
            const q = quizData[gameState.quizIndex];
            const isCorrect = selectedIndex === q.answer;

            const buttons = document.querySelectorAll('#quiz-options-container button');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.answer) {
                    btn.classList.remove('glass-card');
                    btn.classList.add('bg-emerald-500/30', 'border-emerald-400', 'text-white');
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.remove('glass-card');
                    btn.classList.add('bg-rose-500/30', 'border-rose-400', 'text-white');
                }
            });

            if (isCorrect) {
                gameState.quizScore++;
                gameState.lightningCount++;
                showQuizPopup(true, q.explanation);
            } else {
                showQuizPopup(false, q.explanation);
            }

            calculateTotalXP();
            document.getElementById('display-xp').innerText = gameState.xp;

            setTimeout(() => {
                hideQuizPopup();
                gameState.quizIndex++;
                gameState.showHintBox = false;
                renderScreen();
            }, 3000);
        }

        // --- Mode 4: Lightning Quiz & Racing Game ---
        function renderMode4Screen() {
            if (gameState.lightningGamePhase === 'playing') {
                const q = activeLightningQuiz[gameState.lightningQIndex];
                return `
                    <div class="w-full max-w-2xl mx-auto flex flex-col items-center">
                        <div class="w-full flex items-center justify-between mb-4">
                            <button onclick="switchScreen('menu')" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-medium flex items-center gap-2 transition-colors">
                                <i class="fa-solid fa-arrow-left"></i> กลับเมนูหลัก
                            </button>
                            <span class="text-xs font-semibold text-yellow-300">
                                <i class="fa-solid fa-bolt text-yellow-400"></i> สายฟ้าสะสม: ${gameState.lightningScore} / 10 | ข้อที่ ${gameState.lightningQIndex + 1} / 10
                            </span>
                        </div>

                        <div class="glass-panel p-6 md:p-8 rounded-3xl shadow-2xl w-full relative">
                            <div class="w-full bg-white/10 h-2 rounded-full mb-6 overflow-hidden">
                                <div class="bg-gradient-to-r from-yellow-400 to-amber-500 h-full transition-all duration-300" style="width: ${((gameState.lightningQIndex + 1) / 10) * 100}%"></div>
                            </div>

                            <div class="text-center mb-6">
                                <span class="px-3.5 py-1 rounded-full bg-yellow-500/20 text-yellow-300 text-xs font-bold border border-yellow-500/30">
                                    ⚡ คำถามสายฟ้า (ตอบถูกเก็บสายฟ้าเพิ่มพลังรถแข่ง)
                                </span>
                                <h3 class="text-lg md:text-xl font-bold text-white mt-3 leading-relaxed">
                                    ${q.question}
                                </h3>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                                ${q.options.map((opt, idx) => `
                                    <button onclick="handleLightningQuizAnswer('${opt.replace(/'/g, "\\'")}')" 
                                        class="p-4 rounded-2xl glass-card hover:bg-yellow-500/30 hover:border-yellow-400 transition-all text-xs md:text-sm font-medium text-white flex items-center gap-3 group">
                                        <span class="w-7 h-7 rounded-xl bg-white/10 group-hover:bg-yellow-500 group-hover:text-slate-950 flex items-center justify-center text-xs font-bold text-yellow-300 transition-colors shrink-0">
                                            ${String.fromCharCode(65 + idx)}
                                        </span>
                                        <span class="text-left">${opt}</span>
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (gameState.lightningGamePhase === 'racing') {
                return `
                    <div class="w-full max-w-3xl mx-auto flex flex-col items-center">
                        <div class="w-full flex items-center justify-between mb-4">
                            <button onclick="switchScreen('menu')" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-medium flex items-center gap-2 transition-colors">
                                <i class="fa-solid fa-arrow-left"></i> กลับเมนูหลัก
                            </button>
                            <span class="text-xs font-semibold text-yellow-300">
                                ⚡ พลังงานสายฟ้าทั้งหมด: ${gameState.lightningScore} สายฟ้า (+${gameState.lightningScore * 50} XP)
                            </span>
                        </div>

                        <div class="glass-panel p-6 rounded-3xl w-full flex flex-col items-center relative overflow-hidden shadow-2xl">
                            <h3 class="text-lg font-bold text-yellow-300 mb-2">🏎️ รถแข่งพลังงานสายฟ้ากำลังพุ่งทะยานเข้าเส้นชัย!</h3>
                            <p class="text-xs text-slate-300 mb-6">ใช้สายฟ้าที่ตอบถูกเป็นพลังงานความเร็ว (เก็บได้ ${gameState.lightningScore}/10 สายฟ้า)</p>

                            <canvas id="race-canvas" width="600" height="200" class="w-full h-auto bg-slate-950/80 rounded-2xl border border-white/10 shadow-inner mb-6"></canvas>

                            <button onclick="finishRaceTransition()" class="px-8 py-3 rounded-xl bg-gradient-to-r from-yellow-500 to-amber-600 text-slate-950 font-bold text-sm shadow-lg hover:opacity-95 transition-all">
                                ดูสรุปผลคะแนนและรับเกียรติบัตร
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function handleLightningQuizAnswer(selectedOpt) {
            const q = activeLightningQuiz[gameState.lightningQIndex];
            const isCorrect = (selectedOpt === q.correct);

            if (isCorrect) {
                gameState.lightningScore++;
                gameState.lightningCount++;
                showToast("ถูกต้อง! ⚡ เก็บสายฟ้าสะสมสำเร็จ", "success");
            } else {
                showToast("ยังไม่ถูกต้อง! พลังงานสายฟ้าข้อนี้พลาดไป", "error");
            }

            gameState.lightningQIndex++;
            if (gameState.lightningQIndex >= 10) {
                gameState.lightningGamePhase = 'racing';
            }
            renderScreen();
        }

        function initRaceCanvas() {
            const canvas = document.getElementById('race-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let carPos = 40;
            const targetPos = 480 * (gameState.lightningScore / 10) + 40;

            function animateCar() {
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw Track & Finish Line
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.setLineDash([15, 15]);
                ctx.beginPath(); ctx.moveTo(0, 100); ctx.lineTo(canvas.width, 100); ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = '#eab308';
                ctx.fillRect(520, 40, 10, 120);
                ctx.fillStyle = '#fff';
                ctx.font = '10px Prompt';
                ctx.fillText("FINISH", 505, 30);

                if (carPos < targetPos) {
                    carPos += 3;
                }

                // Draw Car
                ctx.fillStyle = '#38bdf8';
                ctx.roundRect(carPos, 80, 70, 35, 10);
                ctx.fill();
                ctx.fillStyle = '#1e1b4b';
                ctx.fillRect(carPos + 15, 68, 40, 16);

                // Wheels
                ctx.fillStyle = '#0f172a';
                ctx.beginPath(); ctx.arc(carPos + 18, 115, 9, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(carPos + 52, 115, 9, 0, Math.PI*2); ctx.fill();

                if (carPos < targetPos) {
                    gameState.raceAnimFrame = requestAnimationFrame(animateCar);
                }
            }
            animateCar();
        }

        function finishRaceTransition() {
            gameState.currentScreen = 'summary';
            renderScreen();
        }

        function showQuizPopup(isCorrect, explanation) {
            const popup = document.getElementById('quiz-popup');
            const icon = document.getElementById('popup-icon');
            const title = document.getElementById('popup-title');
            const desc = document.getElementById('popup-desc');
            const boxStyle = document.getElementById('popup-box-style');

            if (isCorrect) {
                icon.className = "w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-4 shadow-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
                icon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                title.innerText = "ถูกต้อง! ⚡ +100 XP";
                title.className = "text-xl font-bold text-emerald-300 mb-2";
                boxStyle.className = "glass-panel p-6 md:p-8 rounded-3xl max-w-md w-full mx-auto text-center border-2 border-emerald-500/50 shadow-2xl bg-emerald-950/90";
            } else {
                icon.className = "w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-4 shadow-lg bg-rose-500/20 text-rose-300 border border-rose-500/40";
                icon.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                title.innerText = "ยังไม่ถูกต้อง!";
                title.className = "text-xl font-bold text-rose-300 mb-2";
                boxStyle.className = "glass-panel p-6 md:p-8 rounded-3xl max-w-md w-full mx-auto text-center border-2 border-rose-500/50 shadow-2xl bg-rose-950/90";
            }

            desc.innerHTML = `<b>คำอธิบาย:</b> ${explanation}`;
            popup.classList.remove('hidden');
        }

        function hideQuizPopup() {
            const popup = document.getElementById('quiz-popup');
            popup.classList.add('hidden');
        }

        // --- Summary Screen with Certificate ---
        function renderSummaryScreen() {
            const totalQ = quizData.length;
            const percentage = Math.round((gameState.quizScore / totalQ) * 100);
            calculateTotalXP();

            return `
                <div class="w-full max-w-3xl mx-auto flex flex-col items-center animate-fade-in space-y-6">
                    <div class="w-full flex items-center justify-between">
                        <button onclick="switchScreen('menu')" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-medium flex items-center gap-2 transition-colors">
                            <i class="fa-solid fa-arrow-left"></i> กลับเมนูหลัก
                        </button>
                        <span class="text-xs font-semibold text-yellow-300"><i class="fa-solid fa-bolt mr-1"></i> คะแนน XP รวม: ${gameState.xp} XP</span>
                    </div>

                    <div class="w-full certificate-box p-8 md:p-10 rounded-3xl shadow-2xl text-center relative overflow-hidden">
                        <div class="absolute -right-10 -bottom-10 text-yellow-600/10 text-9xl pointer-events-none">
                            <i class="fa-solid fa-award"></i>
                        </div>

                        <div class="flex items-center justify-center gap-2 mb-2 text-yellow-800">
                            <i class="fa-solid fa-bolt text-yellow-600"></i>
                            <span class="text-xs font-bold uppercase tracking-widest">เกียรติบัตรเชิดชูเกียรติการเรียนรู้ออนไลน์</span>
                            <i class="fa-solid fa-bolt text-yellow-600"></i>
                        </div>

                        <h2 class="text-xl md:text-3xl font-extrabold text-amber-900 mb-1 tracking-wide">
                            เกียรติบัตรฉบับนี้ให้ไว้เพื่อแสดงว่า
                        </h2>

                        <div class="my-4 py-3 border-y border-amber-400/60 max-w-lg mx-auto">
                            <h3 class="text-2xl md:text-4xl font-bold text-slate-900 underline decoration-amber-600 underline-offset-8">
                                ${gameState.playerName || "ผู้เรียนคนเก่ง"}
                            </h3>
                        </div>

                        <p class="text-xs md:text-sm text-slate-700 leading-relaxed max-w-xl mx-auto mb-6">
                            ได้ปฏิบัติกิจกรรมการเรียนรู้และผ่านเกณฑ์การทดสอบ เรื่อง <b>"พลังแห่งแรง: ดินแดนฟิสิกส์ ม.2"</b> อย่างเต็มความสามารถ
                        </p>

                        <div class="flex justify-center gap-6 mb-8 text-xs font-semibold text-slate-800">
                            <div class="bg-amber-100/80 px-4 py-2 rounded-xl border border-amber-300">
                                📊 คะแนนข้อสอบ: <span class="text-amber-900 font-bold">${gameState.quizScore} / ${totalQ}</span> (${percentage}%)
                            </div>
                            <div class="bg-amber-100/80 px-4 py-2 rounded-xl border border-amber-300">
                                ⚡ คะแนนสะสม XP: <span class="text-amber-900 font-bold">${gameState.xp} XP</span>
                            </div>
                        </div>

                        <div class="flex justify-around items-center pt-4 border-t border-amber-400/40 text-xs text-slate-800">
                            <div class="text-center">
                                <div class="font-bold text-amber-900 mb-1">ห้องเรียนครูปลานุ่น</div>
                                <div class="text-[11px] text-slate-600">แหล่งเรียนรู้วิทยาศาสตร์ ม.2</div>
                            </div>
                            <div class="text-center">
                                <div class="font-bold text-amber-900 mb-1">(ครูสมฤดี พูนผล)</div>
                                <div class="text-[11px] text-slate-600">ผู้จัดทำสื่อการเรียนรู้</div>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-4 w-full max-w-md">
                        <button onclick="window.print()" class="flex-1 py-3.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-xs font-bold text-slate-950 transition-colors flex items-center justify-center gap-2 shadow-lg">
                            <i class="fa-solid fa-camera"></i> พิมพ์ / แคปหน้าจอเกียรติบัตร
                        </button>
                        <button onclick="switchScreen('menu')" class="flex-1 py-3.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold text-white transition-colors flex items-center justify-center gap-2">
                            <i class="fa-solid fa-house"></i> กลับเมนูหลัก
                        </button>
                    </div>
                </div>
            `;
        }

        function showToast(message, type = 'success') {
            const existingToast = document.getElementById('custom-toast');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.id = 'custom-toast';
            toast.className = `fixed bottom-6 right-6 z-50 px-5 py-3 rounded-2xl glass-panel text-xs md:text-sm font-medium shadow-2xl border flex items-center gap-3 animate-bounce transition-all ${
                type === 'success' ? 'border-emerald-500/50 text-emerald-200 bg-emerald-950/80' : 'border-rose-500/50 text-rose-200 bg-rose-950/80'
            }`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-triangle-exclamation text-rose-400'} text-base"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 3500);
        }
    </script>
</body>
</html>
